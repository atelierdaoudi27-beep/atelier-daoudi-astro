<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="kineticBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f3ef"/>
      <stop offset="100%" stop-color="#e9e7e0"/>
    </linearGradient>
    <pattern id="kineticGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#dcd9cc" stroke-width="0.8"/>
    </pattern>
    <marker id="kSunArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97724"/>
    </marker>
    <marker id="kLuxArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b7a57"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#kineticBg)"/>
  <rect width="1200" height="750" fill="url(#kineticGrid)"/>

  <!-- Technical Border Frame -->
  <rect x="35" y="35" width="1130" height="680" fill="none" stroke="#cbc8ba" stroke-width="1.5"/>
  <rect x="42" y="42" width="1116" height="666" fill="none" stroke="#cbc8ba" stroke-width="0.75" stroke-dasharray="4,4"/>

  <!-- Masthead -->
  <text x="65" y="78" fill="#a0522d" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" font-weight="bold">ARCHDAILY RESEARCH DOSSIER / COMPUTATIONAL FACADE PHYSICS</text>
  <text x="65" y="118" fill="#1e242b" font-family="Georgia, serif" font-size="30" font-weight="normal">Kinetic &amp; Parametric Screens: Algorithmic Shading &amp; Solar Vector Tracking</text>
  <text x="65" y="142" fill="#5c646d" font-family="Arial, sans-serif" font-size="13">Responsive Origami Tessellations, Dynamic Solar Geometry, and Glare-Free Daylight Autonomy</text>

  <!-- Left: Solar Vector & Elevation Section Diagram -->
  <g transform="translate(65, 175)">
    <!-- Sub-heading -->
    <text x="0" y="20" fill="#2c3e50" font-family="Georgia, serif" font-size="18" font-weight="bold">01. Solar Incident Ray Vectors (Altitude 72° Summer vs 28° Winter)</text>

    <!-- Structural Floor Slabs (Section) -->
    <rect x="380" y="45" width="70" height="18" fill="#b0b5b3" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="455" y="58" fill="#2c3e50" font-family="'Courier New', monospace" font-size="10">FLOOR SLAB N+1</text>
    <rect x="380" y="240" width="70" height="18" fill="#b0b5b3" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="455" y="253" fill="#2c3e50" font-family="'Courier New', monospace" font-size="10">FLOOR SLAB N</text>

    <!-- Double Glazed Curtain Wall Line -->
    <rect x="370" y="63" width="10" height="177" fill="#cce3f0" stroke="#487eb0" stroke-width="1.5"/>
    <text x="350" y="160" fill="#487eb0" font-family="'Courier New', monospace" font-size="10" transform="rotate(-90 350 160)">LOW-E DOUBLE GLAZING (U=1.1 W/m²K)</text>

    <!-- Secondary Structural Bracket (Sub-frame cantilever) -->
    <line x1="380" y1="72" x2="280" y2="72" stroke="#4a5568" stroke-width="2"/>
    <line x1="380" y1="230" x2="280" y2="230" stroke="#4a5568" stroke-width="2"/>
    <line x1="280" y1="72" x2="280" y2="230" stroke="#4a5568" stroke-width="2"/>
    <text x="240" y="150" fill="#4a5568" font-family="'Courier New', monospace" font-size="9" transform="rotate(-90 240 150)">700mm CAVITY AIR BUFFER</text>

    <!-- Kinetic Module Closed (Summer State: 72° cut-off) -->
    <!-- Louver 1 folded outward -->
    <polygon points="280,85 240,115 280,145" fill="#d29054" stroke="#874e1d" stroke-width="1.5"/>
    <circle cx="240" cy="115" r="4" fill="#874e1d"/>
    <!-- Louver 2 folded outward -->
    <polygon points="280,155 240,185 280,215" fill="#d29054" stroke="#874e1d" stroke-width="1.5"/>
    <circle cx="240" cy="185" r="4" fill="#874e1d"/>

    <!-- Solar Rays: Summer Solstice at 72° altitude -->
    <line x1="80" y1="30" x2="235" y2="110" stroke="#d97724" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#kSunArrow)"/>
    <text x="40" y="25" fill="#d97724" font-family="'Courier New', monospace" font-size="11" font-weight="bold">SUMMER NOON (72°): 100% DIRECT IRRADIANCE REFLECTED</text>
    <line x1="80" y1="100" x2="235" y2="180" stroke="#d97724" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#kSunArrow)"/>

    <!-- Winter Solstice ray entering at 28° -->
    <line x1="60" y1="210" x2="365" y2="140" stroke="#3b7a57" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#kLuxArrow)"/>
    <text x="15" y="235" fill="#3b7a57" font-family="'Courier New', monospace" font-size="11" font-weight="bold">WINTER SOLSTICE (28°): DEEP PASSIVE SOLAR HEATING PENETRATION</text>

    <!-- Micro-climate note -->
    <rect x="0" y="270" width="460" height="70" fill="#ffffff" fill-opacity="0.8" stroke="#dcd9cc" rx="4"/>
    <text x="15" y="292" fill="#1e242b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Thermodynamic Surface Decoupling:</text>
    <text x="15" y="310" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">The 700mm ventilated air gap dissipates up to 65% of solar heat before it reaches</text>
    <text x="15" y="326" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">the curtain wall glass, effectively neutralizing thermal bridging.</text>
  </g>

  <!-- Right: Parametric Tessellation & Actuator Geometry (Exploded View) -->
  <g transform="translate(590, 175)">
    <text x="0" y="20" fill="#2c3e50" font-family="Georgia, serif" font-size="18" font-weight="bold">02. Parametric Origami Tessellation &amp; Pneumatic Actuation Node</text>

    <!-- Tessellation Graphic (Triangulated Mashrabiya cells) -->
    <g transform="translate(40, 50)">
      <!-- Cell 1 (Open State) -->
      <polygon points="80,10 160,70 120,130" fill="#ecd3b6" stroke="#b27339" stroke-width="1.5"/>
      <polygon points="80,10 0,70 40,130" fill="#f4e4cf" stroke="#b27339" stroke-width="1.5"/>
      <polygon points="40,130 120,130 80,170" fill="#dfbe98" stroke="#b27339" stroke-width="1.5"/>
      <circle cx="80" cy="90" r="5" fill="#874e1d"/>
      <text x="15" y="195" fill="#874e1d" font-family="'Courier New', monospace" font-size="10" font-weight="bold">OPEN CELL (Diffused Daylight: 78%)</text>

      <!-- Cell 2 (Folded Shading State - Afternoon High Heat) -->
      <g transform="translate(240, 0)">
        <polygon points="80,10 140,50 100,130" fill="#b27339" stroke="#5a310c" stroke-width="1.8"/>
        <polygon points="80,10 20,50 60,130" fill="#874e1d" stroke="#5a310c" stroke-width="1.8"/>
        <polygon points="60,130 100,130 80,180" fill="#5a310c" stroke="#351a04" stroke-width="1.8"/>
        <!-- Perforation grid dots on metal blade -->
        <circle cx="50" cy="65" r="1.5" fill="#f4e4cf"/>
        <circle cx="60" cy="75" r="1.5" fill="#f4e4cf"/>
        <circle cx="45" cy="85" r="1.5" fill="#f4e4cf"/>
        <circle cx="70" cy="85" r="1.5" fill="#f4e4cf"/>
        <circle cx="55" cy="95" r="1.5" fill="#f4e4cf"/>
        <circle cx="110" cy="65" r="1.5" fill="#f4e4cf"/>
        <circle cx="100" cy="75" r="1.5" fill="#f4e4cf"/>
        <circle cx="115" cy="85" r="1.5" fill="#f4e4cf"/>
        <circle cx="90" cy="85" r="1.5" fill="#f4e4cf"/>
        <circle cx="105" cy="95" r="1.5" fill="#f4e4cf"/>
        <!-- Central Servo Piston -->
        <rect x="76" y="80" width="8" height="25" fill="#2d3748"/>
        <circle cx="80" cy="92" r="3" fill="#e2e8f0"/>
        <text x="5" y="195" fill="#5a310c" font-family="'Courier New', monospace" font-size="10" font-weight="bold">FOLDED CELL (Solar Cut-off SHGC=0.18)</text>
      </g>
    </g>

    <!-- Technical Spec Card -->
    <rect x="0" y="270" width="510" height="70" fill="#ffffff" fill-opacity="0.8" stroke="#dcd9cc" rx="4"/>
    <text x="15" y="292" fill="#1e242b" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Micro-perforated Anodized Bronze Panels (Laser Cut):</text>
    <text x="15" y="310" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Perforation gradient from 15% (core solar shield) to 55% (perimeter view angle).</text>
    <text x="15" y="326" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Linear brushless actuators consume &lt; 0.08 kWh/m²/year via rooftop micro-PV.</text>
  </g>

  <!-- Bottom Engineering Metrics Grid -->
  <g transform="translate(65, 545)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="250" height="135" fill="#ffffff" stroke="#e2ded4" rx="4"/>
    <text x="20" y="32" fill="#718096" font-family="'Courier New', monospace" font-size="11" letter-spacing="1">SHGC EFFICIENCY</text>
    <text x="20" y="70" fill="#a0522d" font-family="Georgia, serif" font-size="34" font-weight="bold">0.18</text>
    <text x="110" y="70" fill="#a0aec0" font-family="Arial, sans-serif" font-size="13">vs 0.68 base</text>
    <text x="20" y="100" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Total solar heat gain rejection of</text>
    <text x="20" y="116" fill="#2d3748" font-family="Arial, sans-serif" font-size="11" font-weight="bold">73.5% across peak azimuth angles.</text>

    <!-- Metric 2 -->
    <rect x="270" y="0" width="250" height="135" fill="#ffffff" stroke="#e2ded4" rx="4"/>
    <text x="290" y="32" fill="#718096" font-family="'Courier New', monospace" font-size="11" letter-spacing="1">DAYLIGHT AUTONOMY</text>
    <text x="290" y="70" fill="#2e7d32" font-family="Georgia, serif" font-size="34" font-weight="bold">78%</text>
    <text x="375" y="70" fill="#a0aec0" font-family="Arial, sans-serif" font-size="13">sDA 300/50%</text>
    <text x="290" y="100" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Maintains &gt;300 lux deep floor illumination</text>
    <text x="290" y="116" fill="#2d3748" font-family="Arial, sans-serif" font-size="11" font-weight="bold">without artificial lighting 8am–5pm.</text>

    <!-- Metric 3 -->
    <rect x="540" y="0" width="250" height="135" fill="#ffffff" stroke="#e2ded4" rx="4"/>
    <text x="560" y="32" fill="#718096" font-family="'Courier New', monospace" font-size="11" letter-spacing="1">PEAK COOLING LOAD</text>
    <text x="560" y="70" fill="#2b6cb0" font-family="Georgia, serif" font-size="34" font-weight="bold">-42%</text>
    <text x="655" y="70" fill="#a0aec0" font-family="Arial, sans-serif" font-size="13">HVAC tons</text>
    <text x="560" y="100" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Chiller sizing downsized by 38%,</text>
    <text x="560" y="116" fill="#2d3748" font-family="Arial, sans-serif" font-size="11" font-weight="bold">slashing CAPEX and operational kWh.</text>

    <!-- Metric 4 -->
    <rect x="810" y="0" width="255" height="135" fill="#ffffff" stroke="#e2ded4" rx="4"/>
    <text x="830" y="32" fill="#718096" font-family="'Courier New', monospace" font-size="11" letter-spacing="1">DISCOMFORT GLARE</text>
    <text x="830" y="70" fill="#6b46c1" font-family="Georgia, serif" font-size="34" font-weight="bold">&lt; 19</text>
    <text x="910" y="70" fill="#a0aec0" font-family="Arial, sans-serif" font-size="13">DGI Index</text>
    <text x="830" y="100" fill="#4a5568" font-family="Arial, sans-serif" font-size="11">Classified as 'Imperceptible Glare'</text>
    <text x="830" y="116" fill="#2d3748" font-family="Arial, sans-serif" font-size="11" font-weight="bold">per EN 14501 Visual Comfort standard.</text>
  </g>
</svg>
