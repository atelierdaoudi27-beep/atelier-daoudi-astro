<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <!-- Background & Grid -->
    <linearGradient id="cadBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9f5"/>
      <stop offset="100%" stop-color="#f0eee4"/>
    </linearGradient>
    <pattern id="cadGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e2ded2" stroke-width="0.75"/>
    </pattern>

    <!-- Material Hatches -->
    <pattern id="stoneHatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 16 L 16 0 M 0 0 L 16 16" fill="none" stroke="#a69b8d" stroke-width="0.75"/>
    </pattern>
    <pattern id="vaultHatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 10 L 10 0" fill="none" stroke="#795548" stroke-width="0.8"/>
    </pattern>
    <pattern id="insulationHatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 Q 2 0 4 4 T 8 4" fill="none" stroke="#e67e22" stroke-width="0.8"/>
    </pattern>
    <pattern id="soilHatch" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 M 0 0 L 20 20" fill="none" stroke="#cbbfad" stroke-width="0.6"/>
    </pattern>

    <!-- Physics Gradients -->
    <linearGradient id="spaceRadGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a69bd" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1e3799" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0c2461" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="solarReflGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="capillaryCoolingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0097e6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowSpace" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0c2461"/>
    </marker>
    <marker id="arrowSolar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e67e22"/>
    </marker>
    <marker id="arrowRefl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d35400"/>
    </marker>
    <marker id="arrowHydronicCool" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0984e3"/>
    </marker>
    <marker id="arrowHydronicReturn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrowAirPurge" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#20bf6b"/>
    </marker>
    <marker id="dimTick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <line x1="2" y1="8" x2="8" y2="2" stroke="#2d3436" stroke-width="1.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#cadBg)"/>
  <rect width="1200" height="820" fill="url(#cadGrid)"/>

  <!-- Master Border -->
  <rect x="25" y="25" width="1150" height="770" fill="none" stroke="#2d3436" stroke-width="2"/>
  <rect x="31" y="31" width="1138" height="758" fill="none" stroke="#795548" stroke-width="0.8" stroke-dasharray="6,4"/>

  <!-- Masthead Block -->
  <g id="masthead">
    <rect x="35" y="35" width="1130" height="96" fill="#ffffff" fill-opacity="0.9" stroke="#d5cfbe" stroke-width="1"/>
    <text x="55" y="60" fill="#795548" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" font-weight="bold">ATELIER DAOUDI ARCHITECTURAL REVIEW · DETAIL &amp; ARCHDAILY RESEARCH DOSSIER</text>
    <text x="55" y="90" fill="#2d3436" font-family="Georgia, serif" font-size="22" font-weight="bold">Sub-Ambient Passive Radiative Cooling (PRC) &amp; Capillary Vault Thermodynamics</text>
    <text x="55" y="113" fill="#636e72" font-family="Arial, sans-serif" font-size="12">Atmospheric Infrared Window (8–13 µm) Radiative Sink Coupled to Monolithic Pozzolan-Lime Vault · Scale 1:50 Metric (mm)</text>

    <!-- Meta Info Box -->
    <rect x="980" y="45" width="170" height="76" fill="#f8f9fa" stroke="#b2bec3" stroke-width="1"/>
    <text x="990" y="64" fill="#2d3436" font-family="'Courier New', monospace" font-size="10" font-weight="bold">DOSSIER: PRC-VAULT-2026</text>
    <text x="990" y="80" fill="#636e72" font-family="'Courier New', monospace" font-size="9">DATE: 2026-11-15 (08:30 DZ)</text>
    <text x="990" y="95" fill="#636e72" font-family="'Courier New', monospace" font-size="9">STANDARD: ISO 52016 / EN 16798</text>
    <text x="990" y="110" fill="#e67e22" font-family="'Courier New', monospace" font-size="9" font-weight="bold">STATUS: PROPOSED FOR APPROVAL</text>
  </g>

  <!-- DEEP SPACE SKY VAULT (Upper Region y: 135 to 250) -->
  <rect x="40" y="135" width="1120" height="110" fill="url(#spaceRadGrad)"/>
  <text x="60" y="160" fill="#ffffff" font-family="'Courier New', monospace" font-size="11" font-weight="bold">COLD SINK OF DEEP SPACE (T_space ≈ 3 K / -270.15°C)</text>
  <text x="60" y="178" fill="#dcdde1" font-family="Arial, sans-serif" font-size="10">Atmospheric Transparency Window: λ = 8.0 µm to 13.0 µm · Unimpeded Longwave Infrared (LWIR) Transmission</text>
  <text x="60" y="195" fill="#f5cd79" font-family="'Courier New', monospace" font-size="10">Net Radiative Flux: q_rad = -118 W/m² (Sub-Ambient Depression ΔT_surf = -6.8 K under full sun)</text>

  <!-- NATURAL GRADE & EARTH STRATA (y: 640 to 780) -->
  <rect x="40" y="640" width="1120" height="140" fill="#f4ece1"/>
  <rect x="40" y="640" width="1120" height="140" fill="url(#soilHatch)"/>
  <line x1="40" y1="640" x2="1160" y2="640" stroke="#3e2723" stroke-width="3"/>
  <text x="50" y="632" fill="#3e2723" font-family="'Courier New', monospace" font-size="11" font-weight="bold">FINISHED GRADE ELEVATION ±0.000 m</text>
  <text x="50" y="665" fill="#6d4c41" font-family="'Courier New', monospace" font-size="10">HIGH THERMAL INERTIA SUB-BASE: Sand &amp; Compacted Gravel Bedding (k = 1.45 W/m·K)</text>
  <text x="50" y="682" fill="#0984e3" font-family="'Courier New', monospace" font-size="10" font-weight="bold">INSULATED SLAB: 120mm EPS (λ = 0.032 W/m·K) + 150mm High-Albedo Micro-Cement Floor</text>

  <!-- BUILDING SECTION GEOMETRY -->
  <!-- Left Wall: x: 180 to 240 (600mm composite stone) -->
  <!-- Interior Room: x: 240 to 860 (Span = 6,200mm) -->
  <!-- Right Wall: x: 860 to 920 (600mm composite stone) -->

  <!-- Left Wall -->
  <rect x="180" y="320" width="60" height="320" fill="#e8dfd5"/>
  <rect x="180" y="320" width="60" height="320" fill="url(#stoneHatch)"/>
  <rect x="180" y="320" width="60" height="320" fill="none" stroke="#2d3436" stroke-width="2"/>

  <!-- Right Wall with Recessed Triple Glazing and Clerestory -->
  <rect x="860" y="320" width="60" height="320" fill="#e8dfd5"/>
  <rect x="860" y="320" width="60" height="320" fill="url(#stoneHatch)"/>
  <rect x="860" y="320" width="60" height="320" fill="none" stroke="#2d3436" stroke-width="2"/>

  <!-- Recessed Opening on Right Wall: y: 440 to 640 -->
  <rect x="860" y="440" width="60" height="200" fill="#ffffff" stroke="#2d3436" stroke-width="1.5"/>
  <line x1="890" y1="440" x2="890" y2="640" stroke="#0984e3" stroke-width="2.5"/>
  <!-- Clerestory Window on Right Wall: y: 340 to 390 -->
  <rect x="860" y="340" width="60" height="50" fill="#dff9fb" stroke="#2d3436" stroke-width="1.5"/>
  <line x1="890" y1="340" x2="890" y2="390" stroke="#20bf6b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- MONOLITHIC LIME-POZZOLAN VAULTED CEILING -->
  <!-- Span from x: 240 to 860, Springing line y = 390, Crown apex y = 330 (Height = 600mm rise) -->
  <!-- Outer Arc and Inner Arc forming a 250mm thick vault -->
  <path d="M 240 390 Q 550 300 860 390 L 860 355 Q 550 265 240 355 Z" fill="#eedcc8"/>
  <path d="M 240 390 Q 550 300 860 390 L 860 355 Q 550 265 240 355 Z" fill="url(#vaultHatch)"/>
  <path d="M 240 390 Q 550 300 860 390" fill="none" stroke="#2d3436" stroke-width="2.5"/>
  <path d="M 240 355 Q 550 265 860 355" fill="none" stroke="#2d3436" stroke-width="1.5"/>

  <!-- Capillary Radiant Cooling Tube Network (Embedded in Intrados 25mm deep) -->
  <path d="M 255 385 Q 550 297 845 385" fill="none" stroke="#00a8ff" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Radiant cooling field gradient under vault -->
  <path d="M 240 390 Q 550 300 860 390 L 860 480 L 240 480 Z" fill="url(#capillaryCoolingGrad)"/>

  <!-- ROOF SLAB & PASSIVE RADIATIVE COOLING METAMATERIAL COLLECTOR -->
  <!-- Roof structure above vault: x: 160 to 940, Top Level y = 255 -->
  <!-- Overhang cantilever Left: x: 100 to 180 (800mm), Right: x: 860 to 1020 (1600mm deep overhang) -->
  <rect x="100" y="270" width="940" height="35" fill="#f1f2f6" stroke="#2d3436" stroke-width="1.5"/>
  <!-- PIR/Aerogel Thermal Insulation Layer (180mm): y: 258 to 270 -->
  <rect x="100" y="258" width="940" height="12" fill="#ffeaa7"/>
  <rect x="100" y="258" width="940" height="12" fill="url(#insulationHatch)"/>
  <line x1="100" y1="258" x2="1040" y2="258" stroke="#d35400" stroke-width="1"/>

  <!-- PRC METAMATERIAL COATING (Topmost surface: y = 255) -->
  <rect x="120" y="250" width="900" height="8" fill="#ffffff" stroke="#0984e3" stroke-width="1.8"/>
  <text x="350" y="244" fill="#0c2461" font-family="'Courier New', monospace" font-size="10" font-weight="bold">PASSIVE RADIATIVE METASURFACE (R_solar = 97.2%, ε_8-13µm = 0.95)</text>

  <!-- CANTILEVERED TIMBER BRISE-SOLEIL SHADING (Right Overhang) -->
  <rect x="920" y="305" width="160" height="14" fill="#8d6e63" stroke="#4e342e" stroke-width="1.2"/>
  <line x1="940" y1="319" x2="940" y2="335" stroke="#4e342e" stroke-width="1.5"/>
  <line x1="980" y1="319" x2="980" y2="335" stroke="#4e342e" stroke-width="1.5"/>
  <line x1="1020" y1="319" x2="1020" y2="335" stroke="#4e342e" stroke-width="1.5"/>
  <line x1="1060" y1="319" x2="1060" y2="335" stroke="#4e342e" stroke-width="1.5"/>

  <!-- PHYSICS VECTORS: SOLAR & RADIATIVE SINK -->
  <!-- Direct Solar Influx & High-Albedo Reflection (Left/Center) -->
  <line x1="300" y1="160" x2="350" y2="245" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arrowSolar)"/>
  <text x="230" y="195" fill="#e67e22" font-family="Arial, sans-serif" font-size="10" font-weight="bold">I_solar = 1,020 W/m²</text>
  <line x1="350" y1="245" x2="410" y2="165" stroke="#d35400" stroke-width="2" marker-end="url(#arrowRefl)"/>
  <text x="400" y="205" fill="#d35400" font-family="Arial, sans-serif" font-size="9" font-weight="bold">R_solar = 97.2% Reflected (991 W/m²)</text>

  <!-- Outgoing Atmospheric Window LWIR Radiation Vectors -->
  <line x1="520" y1="245" x2="520" y2="155" stroke="#0c2461" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowSpace)"/>
  <line x1="620" y1="245" x2="620" y2="155" stroke="#0c2461" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowSpace)"/>
  <line x1="720" y1="245" x2="720" y2="155" stroke="#0c2461" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowSpace)"/>
  <text x="545" y="175" fill="#0c2461" font-family="'Courier New', monospace" font-size="11" font-weight="bold">NET LWIR SKY FLUX: q_net = 118 W/m²</text>
  <text x="545" y="192" fill="#0984e3" font-family="'Courier New', monospace" font-size="9">T_ambient = +38.5°C → T_metasurface = +31.5°C (ΔT = -7.0 K)</text>

  <!-- HYDRONIC THERMOSYPHON CLOSED CIRCUIT (Roof Collector to Vault) -->
  <!-- Chilled Supply Line (Blue) flowing down from Roof to Vault Capillary Mat -->
  <path d="M 760 258 L 760 305 L 720 305 L 720 338" fill="none" stroke="#0984e3" stroke-width="2.5" marker-end="url(#arrowHydronicCool)"/>
  <text x="765" y="285" fill="#0984e3" font-family="'Courier New', monospace" font-size="9" font-weight="bold">T_chilled = 19.8°C SUPPLY</text>

  <!-- Return Line (Red/Orange) rising back to Roof -->
  <path d="M 380 340 L 380 305 L 420 305 L 420 258" fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowHydronicReturn)"/>
  <text x="320" y="285" fill="#e74c3c" font-family="'Courier New', monospace" font-size="9" font-weight="bold">T_return = 22.4°C RETURN</text>

  <!-- INDOOR CLIMATIC CONDITIONS & THERMAL COMFORT -->
  <rect x="420" y="470" width="260" height="110" fill="#ffffff" fill-opacity="0.9" stroke="#0984e3" stroke-width="1.2" rx="4"/>
  <text x="435" y="492" fill="#0c2461" font-family="'Courier New', monospace" font-size="11" font-weight="bold">INDOOR MICROCLIMATE METRICS</text>
  <text x="435" y="512" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">Radiant Ceiling Temp: <tspan fill="#0984e3" font-weight="bold">T_radiant = 20.2°C</tspan></text>
  <text x="435" y="530" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">Indoor Operative Temp: <tspan fill="#20bf6b" font-weight="bold">T_op = 23.8°C ± 0.5°C</tspan></text>
  <text x="435" y="548" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">Relative Humidity: <tspan font-weight="bold">48% RH (Hygroscopic Buffer)</tspan></text>
  <text x="435" y="566" fill="#2d3436" font-family="Arial, sans-serif" font-size="10">Draft Rating: <tspan fill="#0984e3" font-weight="bold">DR &lt; 5% (Zero Fan Noise / Laminar)</tspan></text>

  <!-- NOCTURNAL CONVECTIVE PURGING & DAYLIGHT VECTORS -->
  <path d="M 875 365 Q 820 375 760 370" fill="none" stroke="#20bf6b" stroke-width="2" marker-end="url(#arrowAirPurge)"/>
  <text x="895" y="340" fill="#20bf6b" font-family="'Courier New', monospace" font-size="9" font-weight="bold">NOCTURNAL PURGE DRAFT</text>
  <text x="895" y="354" fill="#636e72" font-family="Arial, sans-serif" font-size="8.5">Clerestory Exhaust (ACH = 4.8 h⁻¹)</text>

  <!-- SOLAR CUTOFF ANGLE ON SOUTH FACADE (Right) -->
  <line x1="1080" y1="250" x2="920" y2="440" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="1000" y="380" fill="#d35400" font-family="Arial, sans-serif" font-size="9" font-weight="bold">66° Summer Solstice Cutoff</text>
  <text x="1000" y="394" fill="#636e72" font-family="Arial, sans-serif" font-size="8.5">100% Shading of Glazed Skin</text>

  <!-- DIMENSION LINES & MILLIMETER CALLOUTS (CAD Standard) -->
  <!-- 1. Overhang Dimension: 1600mm on right -->
  <line x1="860" y1="230" x2="1020" y2="230" stroke="#2d3436" stroke-width="1"/>
  <line x1="860" y1="225" x2="860" y2="235" stroke="#2d3436" stroke-width="1"/>
  <line x1="1020" y1="225" x2="1020" y2="235" stroke="#2d3436" stroke-width="1"/>
  <text x="915" y="222" fill="#2d3436" font-family="'Courier New', monospace" font-size="9" font-weight="bold">1,600 mm</text>

  <!-- 2. Room Clear Span Dimension: 6200mm -->
  <line x1="240" y1="610" x2="860" y2="610" stroke="#2d3436" stroke-width="1"/>
  <line x1="240" y1="605" x2="240" y2="615" stroke="#2d3436" stroke-width="1"/>
  <line x1="860" y1="605" x2="860" y2="615" stroke="#2d3436" stroke-width="1"/>
  <text x="525" y="605" fill="#2d3436" font-family="'Courier New', monospace" font-size="10" font-weight="bold">SPAN: 6,200 mm (INTERIOR CLEAR)</text>

  <!-- 3. Wall Thickness Callout: 600mm -->
  <line x1="180" y1="305" x2="240" y2="305" stroke="#2d3436" stroke-width="1"/>
  <line x1="180" y1="300" x2="180" y2="310" stroke="#2d3436" stroke-width="1"/>
  <line x1="240" y1="300" x2="240" y2="310" stroke="#2d3436" stroke-width="1"/>
  <text x="188" y="298" fill="#2d3436" font-family="'Courier New', monospace" font-size="9" font-weight="bold">600 mm</text>

  <!-- 4. Clear Height to Springing Line: 3400mm -->
  <line x1="140" y1="390" x2="140" y2="640" stroke="#2d3436" stroke-width="1"/>
  <line x1="135" y1="390" x2="145" y2="390" stroke="#2d3436" stroke-width="1"/>
  <line x1="135" y1="640" x2="145" y2="640" stroke="#2d3436" stroke-width="1"/>
  <text x="65" y="520" fill="#2d3436" font-family="'Courier New', monospace" font-size="9" font-weight="bold">H_clear: 3,400 mm</text>

  <!-- 5. Vault Thickness Callout: 250mm -->
  <line x1="220" y1="370" x2="245" y2="370" stroke="#795548" stroke-width="1"/>
  <text x="135" y="365" fill="#795548" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold">Vault t = 250 mm</text>

  <!-- FOOTER TECHNICAL LEGEND -->
  <g id="footer-legend">
    <rect x="35" y="720" width="1130" height="65" fill="#ffffff" fill-opacity="0.9" stroke="#d5cfbe" stroke-width="1"/>
    <text x="50" y="738" fill="#2d3436" font-family="'Courier New', monospace" font-size="9" font-weight="bold">COMPONENT TECTONICS &amp; MATERIAL PERFORMANCE SPECIFICATIONS:</text>
    <text x="50" y="753" fill="#636e72" font-family="Arial, sans-serif" font-size="8.5">① Radiative Metamaterial Skin: BaSO₄/Polymer nanocomposite (R_sol = 0.972, ε_8-13µm = 0.95, net q = -118 W/m²) · ② Thermal Insulation: 180mm rigid PIR (λ = 0.022 W/m·K)</text>
    <text x="50" y="768" fill="#636e72" font-family="Arial, sans-serif" font-size="8.5">③ Capillary Tube Mat: Ø4.3x0.8mm PE-RT at 20mm pitch (v_fluid = 0.18 m/s, ΔP_circuit = 12 kPa) · ④ Monolithic Vault: Hydraulic Lime &amp; Volcanic Pozzolan (λ = 0.72 W/m·K, C = 1,850 kJ/m³·K)</text>
    <text x="50" y="780" fill="#795548" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold">⑤ Envelope: 450mm Local Ashlar Limestone + 150mm Aerated Lime Mortar (Thermal Decrement Factor f = 0.04, Phase Shift φ = 12.8 hours)</text>
  </g>
</svg>
