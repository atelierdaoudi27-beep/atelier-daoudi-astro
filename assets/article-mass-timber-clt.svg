<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="timberBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eeece5"/>
      <stop offset="100%" stop-color="#e4e1d4"/>
    </linearGradient>
    <pattern id="timberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d5d2c5" stroke-width="0.8"/>
    </pattern>
    <marker id="tArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#588b8b"/>
    </marker>
    <marker id="sunRay" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c49b4f"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#timberBg)"/>
  <rect width="1200" height="750" fill="url(#timberGrid)"/>

  <!-- Technical Border Frame -->
  <rect x="35" y="35" width="1130" height="680" fill="none" stroke="#cccec3" stroke-width="1.5"/>
  <rect x="42" y="42" width="1116" height="666" fill="none" stroke="#cccec3" stroke-width="0.75" stroke-dasharray="4,4"/>

  <!-- Masthead -->
  <text x="65" y="78" fill="#6b7459" font-family="'Courier New', monospace" font-size="12" letter-spacing="3" font-weight="bold">ARCHDAILY RESEARCH DOSSIER / MASS TIMBER &amp; CLIMATE ENVELOPES</text>
  <text x="65" y="118" fill="#292d27" font-family="Georgia, serif" font-size="32" font-weight="normal">Mass Timber (CLT) &amp; Double-Skin Greenhouse Buffer Thermodynamics</text>
  <text x="65" y="142" fill="#6c7066" font-family="Arial, sans-serif" font-size="13">Structural Tectonics of 5-Ply Cross-Laminated Timber Coupled with 800mm Solar Loggia</text>

  <!-- Section Architectural Drawing -->
  <!-- Ground Line -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#292d27" stroke-width="2.5"/>

  <!-- CLT Structural Columns & Slabs -->
  <!-- Ground Slab Foundation -->
  <rect x="520" y="530" width="460" height="30" fill="#a4ab9a" stroke="#292d27" stroke-width="2"/>
  <text x="680" y="552" fill="#292d27" font-family="'Courier New', monospace" font-size="11" font-weight="bold">LOW-CARBON CONCRETE BASE SLAB</text>

  <!-- Level 1 CLT Slab (5-Ply Cross-Laminated Timber) -->
  <rect x="520" y="330" width="460" height="24" fill="#cbb387" stroke="#292d27" stroke-width="2"/>
  <g stroke="#9f855a" stroke-width="1">
    <line x1="520" y1="338" x2="980" y2="338"/>
    <line x1="520" y1="346" x2="980" y2="346"/>
  </g>
  <text x="680" y="347" fill="#42331c" font-family="'Courier New', monospace" font-size="10" font-weight="bold">5-PLY CLT FLOOR SLAB (200mm, CHAR RATE 0.65mm/min)</text>

  <!-- Roof CLT Slab -->
  <rect x="520" y="180" width="460" height="24" fill="#cbb387" stroke="#292d27" stroke-width="2"/>
  <g stroke="#9f855a" stroke-width="1">
    <line x1="520" y1="188" x2="980" y2="188"/>
    <line x1="520" y1="196" x2="980" y2="196"/>
  </g>

  <!-- CLT Mass Column (Glue-Laminated Timber) -->
  <rect x="940" y="204" width="30" height="326" fill="#baa073" stroke="#292d27" stroke-width="2"/>
  <rect x="540" y="204" width="25" height="326" fill="#baa073" stroke="#292d27" stroke-width="2"/>

  <!-- Interior Conditioned Room -->
  <text x="660" y="270" fill="#292d27" font-family="Georgia, serif" font-size="20">Conditioned Living Core</text>
  <text x="660" y="292" fill="#6c7066" font-family="Arial, sans-serif" font-size="12">Exposed biophilic timber surfaces · Natural VOC humidity regulation</text>

  <!-- Internal Glazing / Thermal Barrier -->
  <line x1="520" y1="204" x2="520" y2="530" stroke="#588b8b" stroke-width="4" opacity="0.8"/>
  <text x="470" y="270" fill="#2f5757" font-family="'Courier New', monospace" font-size="10" transform="rotate(-90 470,270)" font-weight="bold">TRIPLE GLAZED INNER ENVELOPE (U = 0.8 W/m²K)</text>

  <!-- Buffer Zone / Greenhouse Loggia (Width: 900mm) -->
  <rect x="360" y="180" width="160" height="350" fill="#dce6e0" opacity="0.35"/>
  <text x="410" y="380" fill="#24453b" font-family="'Courier New', monospace" font-size="11" transform="rotate(-90 410,380)" font-weight="bold">BIOCLIMATIC GREENHOUSE BUFFER (900mm)</text>

  <!-- External Operable Double-Skin Glass -->
  <line x1="360" y1="180" x2="360" y2="530" stroke="#292d27" stroke-width="3"/>
  <!-- Operable Glass Louvers at Top and Bottom -->
  <line x1="360" y1="190" x2="330" y2="215" stroke="#588b8b" stroke-width="3"/>
  <line x1="360" y1="220" x2="330" y2="245" stroke="#588b8b" stroke-width="3"/>
  <line x1="360" y1="480" x2="330" y2="505" stroke="#588b8b" stroke-width="3"/>
  <line x1="360" y1="510" x2="330" y2="535" stroke="#588b8b" stroke-width="3"/>
  <text x="210" y="210" fill="#24453b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">TOP EXHAUST LOUVERS (OPEN IN SUMMER)</text>
  <text x="210" y="525" fill="#24453b" font-family="'Courier New', monospace" font-size="10" font-weight="bold">BOTTOM INTAKE LOUVERS (OPEN IN SUMMER)</text>

  <!-- Winter Solar Heat Trapping (Sun Ray) -->
  <circle cx="160" cy="300" r="26" fill="#e2c17c"/>
  <text x="90" y="260" fill="#a47d33" font-family="'Courier New', monospace" font-size="11" font-weight="bold">LOW WINTER SUN (32°)</text>
  <line x1="160" y1="300" x2="360" y2="380" stroke="#c49b4f" stroke-width="2.5" marker-end="url(#sunRay)"/>
  <line x1="360" y1="380" x2="520" y2="440" stroke="#c49b4f" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="140" y="420" fill="#c49b4f" font-family="Georgia, serif" font-size="13">Passive Winter Heat Gain: Trapped inside loggia buffer (ΔT = +9°C)</text>

  <!-- Summer Stack Venting Flow Arrow -->
  <path d="M 390,520 Q 380,360 380,200" fill="none" stroke="#588b8b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#tArrow)"/>
  <text x="325" y="340" fill="#2f5757" font-family="'Courier New', monospace" font-size="10" transform="rotate(-90 325,340)">SUMMER CONVECTIVE HEAT PURGE</text>

  <!-- Dimension Line for Buffer Width -->
  <line x1="360" y1="550" x2="520" y2="550" stroke="#6c7066" stroke-width="1.5"/>
  <line x1="360" y1="545" x2="360" y2="555" stroke="#6c7066" stroke-width="1.5"/>
  <line x1="520" y1="545" x2="520" y2="555" stroke="#6c7066" stroke-width="1.5"/>
  <text x="420" y="565" fill="#6c7066" font-family="monospace" font-size="10">900mm</text>

  <!-- Bottom KPI Summary -->
  <rect x="65" y="615" width="1070" height="75" fill="#f8f7f2" stroke="#d5d8cc" stroke-width="1"/>
  <line x1="330" y1="615" x2="330" y2="690" stroke="#d5d8cc" stroke-width="1"/>
  <line x1="600" y1="615" x2="600" y2="690" stroke="#d5d8cc" stroke-width="1"/>
  <line x1="870" y1="615" x2="870" y2="690" stroke="#d5d8cc" stroke-width="1"/>

  <text x="85" y="638" fill="#6b7459" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">CARBON SEQUESTRATION</text>
  <text x="85" y="662" fill="#292d27" font-family="Georgia, serif" font-size="20">-820 kg CO₂/m³ Timber</text>
  <text x="85" y="678" fill="#6c7066" font-family="Arial, sans-serif" font-size="10">Carbon-negative structural frame</text>

  <text x="350" y="638" fill="#6b7459" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">HEATING ENERGY REDUCTION</text>
  <text x="350" y="662" fill="#292d27" font-family="Georgia, serif" font-size="20">-46% Heating Demand</text>
  <text x="350" y="678" fill="#6c7066" font-family="Arial, sans-serif" font-size="10">Through passive solar greenhouse buffer</text>

  <text x="620" y="638" fill="#6b7459" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">SUMMER OVERHEATING RELIEF</text>
  <text x="620" y="662" fill="#292d27" font-family="Georgia, serif" font-size="20">0% Mechanical Overheat</text>
  <text x="620" y="678" fill="#6c7066" font-family="Arial, sans-serif" font-size="10">When louver purge exceeds 15 ACH</text>

  <text x="890" y="638" fill="#6b7459" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">FIRE CODE SAFETY</text>
  <text x="890" y="662" fill="#292d27" font-family="Georgia, serif" font-size="20">REI 90 Minutes</text>
  <text x="890" y="678" fill="#6c7066" font-family="Arial, sans-serif" font-size="10">Predictable solid wood charring layer</text>
</svg>
